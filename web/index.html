<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diiwaan — a queue your customers can join by scanning</title>
<meta name="description" content="Create your account, brand your queue, print one QR code. Customers join with no app and no account.">
<meta name="theme-color" content="#FDFFFC">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%23011627'/%3E%3Crect x='5' y='7' width='9' height='2.4' rx='1.2' fill='%23FDFFFC' opacity='.75'/%3E%3Crect x='5' y='10.8' width='6.5' height='2.4' rx='1.2' fill='%23FDFFFC' opacity='.5'/%3E%3Crect x='5' y='14.6' width='4' height='2.4' rx='1.2' fill='%23FDFFFC' opacity='.35'/%3E%3Ccircle cx='17.6' cy='12' r='2.9' fill='%23FF9F1C'/%3E%3C/svg%3E">
<style>
/* The splash cannot depend on the stylesheet: on a slow network that file is
   itself still in flight, and an unstyled boot screen is a coloured void with a
   glyph in the corner. These few rules travel with the document.

   They are declared BEFORE the stylesheet on purpose. Everything here is a
   starting value for the fraction of a second before diiwaan.css arrives, and
   the stylesheet must be free to override every one of them — an earlier
   version of this block sat after the link and pinned the page to a dark
   ground, which broke light mode outright. */
html { background: #04121D; color: #FBFCFA; }
html[data-theme="light"] { background: #FBFCFA; color: #04121D; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

.boot { min-height: 100dvh; display: grid; place-items: center; align-content: center; gap: 18px; }
.boot svg { opacity: .55; animation: boot-pulse 1.8s ease-in-out infinite; }
.boot__slow {
  opacity: 0; font-size: 13px; letter-spacing: .02em; text-align: center;
  padding: 0 24px; color: #8FA6B8;
  animation: boot-slow 0s linear 6s forwards;
}
@keyframes boot-pulse { 0%, 100% { opacity: .35 } 50% { opacity: .7 } }
@keyframes boot-slow { to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .boot svg { animation: none } }
</style>
<link rel="stylesheet" href="/css/diiwaan.css">
<script src="/js/boot-paint.js"></script>
</head>
<body>
<main id="app"><div class="boot"><svg viewBox="0 0 24 24" width="38" height="38" aria-hidden="true"><rect x="3" y="6" width="11" height="2.6" rx="1.3" fill="currentColor" opacity=".8"/><rect x="3" y="10.7" width="8" height="2.6" rx="1.3" fill="currentColor" opacity=".5"/><rect x="3" y="15.4" width="5" height="2.6" rx="1.3" fill="currentColor" opacity=".3"/><circle cx="18" cy="12" r="3" fill="#E0912F"/></svg><p class="boot__slow">Waa la soo dejinayaa… · Still loading — the connection is slow.</p></div></main>
<script type="module" src="/js/app.js"></script>
</body>
</html>
