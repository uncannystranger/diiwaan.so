<!-- ---------- how this page is found ----------

     A single-page app is one document, so everything a crawler learns about
     Diiwaan it learns here. The canonical is absolute and without a hash: the
     routes inside this app are fragments, and a fragment is not a page — left
     to guess, an indexer treats #/signin as a duplicate of the landing page and
     splits the ranking between them. -->
<link rel="canonical" href="https://diiwaan-so.vercel.app/">

<style>
/* The splash cannot depend on the stylesheet: on a slow network that file is
   itself still in flight, and an unstyled boot screen is a coloured void with a
   glyph in the corner. These few rules travel with the document.

   They are declared BEFORE the stylesheet on purpose. Everything here is a
   starting value for the fraction of a second before diiwaan.css arrives, and
   the stylesheet must be free to override every one of them — an earlier
   version of this block sat after the link and pinned the page to a dark
   ground, which broke light mode outright. */
html { background: #04121D; color: #FBFCFA; }
@media (prefers-color-scheme: light) { html { background: #FBFCFA; color: #04121D; } }
@media (prefers-color-scheme: dark) { html { background: #04121D; color: #FBFCFA; } }
html[data-theme="light"] { background: #FBFCFA; color: #04121D; }
html[data-theme="dark"] { background: #04121D; color: #FBFCFA; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }

.boot { min-height: 100dvh; display: grid; place-items: center; align-content: center; gap: 18px; }
.boot svg { opacity: .55; animation: boot-pulse 1.8s ease-in-out infinite; }
@keyframes boot-pulse { 0%, 100% { opacity: .35 } 50% { opacity: .7 } }
@media (prefers-reduced-motion: reduce) { .boot svg { animation: none } }
</style>

<script src="/js/boot-paint.js"></script>

    <h1 style="font-size:2rem;line-height:1.2;margin:0 0 .6em">Diiwaan — a queue your customers can join by scanning</h1>
    <p style="opacity:.8">Print one QR code and put it on the counter. A customer scans it, types their name, and takes a number — no app to install, no account to create. They wait wherever they like and watch their place from their phone.</p>
    <p style="opacity:.8"><strong>Maareynta safka ganacsiyada Soomaaliyeed.</strong> Samee akoonkaaga, magacaaga iyo astaantaada saar, hal QR daabac. Macaamiishaadu way iskaan gareeyaan, lambar bay qaataan, wayna fadhiistaan — app la’aan, akoon la’aan.</p>
    <h2 style="font-size:1.1rem;margin:2em 0 .4em">What it does</h2>
    <ul style="opacity:.8">
      <li>Customers join by scanning — no app, no account</li>
      <li>Free to start, with unlimited customers on one queue</li>
      <li>Keeps working on a weak connection and catches up on its own</li>
      <li>Your own colours, logo and printed sign</li>
      <li>Somali and English throughout</li>

    <p style="margin-top:2em"><strong>Diiwaan needs JavaScript to run the queue itself.</strong> Turn it on, or open the page in another browser, and the desk loads straight away.</p>
    <p style="opacity:.6;font-size:.9rem;margin-top:3em">made with love by
      <a href="https://instagram.com/uncannystranger" rel="me noopener noreferrer">uncannystranger</a></p>
  </div>
